<div class="meta" id="game-meta">
    <form id="end-turn-form" method="post" 
          hx-post="{% url 'hexquest:game_map' game.id %}" 
          hx-target="#end-turn-btn" 
          hx-select="#end-turn-btn" 
          hx-swap="outerHTML">
        {% csrf_token %}
        <input type="hidden" name="action" value="end_turn">
        <button type="submit" id="end-turn-btn" {% if nation.has_ended_turn %}class="waiting" disabled{% endif %}>
            {% if nation.has_ended_turn %}Waiting...{% else %}End Turn{% endif %}
        </button>
    </form>
    <div class="game-stats">
        <div class="stat-item turn">
            <span class="label">TURN</span>
            <span class="value" id="turn-display">{{ game.current_turn }}</span>
        </div>
        <div class="stat-item timer">
            <span class="label">TIME</span>
            <span class="value" id="timer-display">{{ remaining_time }}</span><span class="unit">s</span>
        </div>
    </div>
    <div class="resources">
        <span class="resource gold" title="Gold">
            <span class="icon">💰</span>
            <span id="gold-display">{{ nation.gold }}</span>
        </span>
        <span class="resource food" title="Food">
            <span class="icon">🍞</span>
            <span id="food-display">{{ nation.food }}</span>
        </span>
        <span class="resource units" title="Units">
            <span class="icon">👥</span>
            <span id="units-display">{{ nation.units.count }}</span>
        </span>
    </div>
</div>
