{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ game.name }} Map</title>
    <link rel="stylesheet" href="{% static 'hexquest/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'hexquest/css/game_map.css' %}">
</head>
<body>
<header>
    <h1>{{ game.name }}</h1>
    <div class="meta">
        Turn <span id="turn-display">{{ game.current_turn }}</span>
        <span>|</span>
        Time: <span id="timer-display">{{ remaining_time }}</span>s
        <span class="resource">💰 <span id="gold-display">{{ nation.gold }}</span></span>
        <span class="resource">🍞 <span id="food-display">{{ nation.food }}</span></span>
        <span class="resource">👥 <span id="units-display">{{ nation.units.count }}</span></span>
    </div>
    <div class="actions">
        <form id="end-turn-form" method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="end_turn">
            <button type="submit" id="end-turn-btn" {% if nation.has_ended_turn %}disabled{% endif %}>
                {% if nation.has_ended_turn %}Waiting...{% else %}End Turn{% endif %}
            </button>
        </form>
    </div>
</header>

<script>
    const gameId = {{ game.id }};
    const gameUpdatesUrl = "{% url 'hexquest:game_updates' game.id %}";
    const currentUserId = {{ request.user.id }};
    const csrfToken = "{{ csrf_token }}";
    let currentTurn = {{ game.current_turn }};
    let remainingTime = {{ remaining_time }};
    let hasEndedTurn = {% if nation.has_ended_turn %}true{% else %}false{% endif %};
</script>

<div class="map-wrap">
    <svg
        id="map"
        width="{{ game.width|add:game.height|add:10 }}00"
        height="{{ game.height|add:10 }}80"
        xmlns="http://www.w3.org/2000/svg"
    >
        {% for hex in hexes %}
            <g
                class="hex-group"
                data-q="{{ hex.q }}"
                data-r="{{ hex.r }}"
                data-terrain="{{ hex.terrain }}"
                data-owner="{% if hex.owner %}{{ hex.owner.name }}{% endif %}"
                data-owner-id="{% if hex.owner %}{{ hex.owner.player.id }}{% endif %}"
                data-owner-color="{% if hex.owner %}{{ hex.owner.color }}{% endif %}"
                data-settlement="{% if hex.settlement %}{{ hex.settlement.name }}{% endif %}"
                data-settlement-id="{% if hex.settlement %}{{ hex.settlement.id }}{% endif %}"
            ></g>
        {% endfor %}

        {% for unit in game.units.all %}
            <g
                class="unit-group"
                id="unit-{{ unit.id }}"
                data-id="{{ unit.id }}"
                data-type="{{ unit.unit_type }}"
                data-q="{{ unit.q }}"
                data-r="{{ unit.r }}"
                data-color="{{ unit.nation.color }}"
                data-owner-id="{{ unit.nation.player.id }}"
                data-last-action-turn="{{ unit.last_action_turn }}"
                data-queued-action="{% if unit.queued_action %}true{% else %}false{% endif %}"
                data-label="{{ unit.unit_type|slice:':1'|upper }}"
            ></g>
        {% endfor %}

        {% for settlement in game.settlements.all %}
            <g
                class="settlement-group"
                data-id="{{ settlement.id }}"
                data-q="{{ settlement.q }}"
                data-r="{{ settlement.r }}"
                data-color="{{ settlement.nation.color }}"
                data-name="{{ settlement.name }}"
                data-tier="{{ settlement.tier }}"
                data-population="{{ settlement.population }}"
                data-last-action-turn="{{ settlement.last_action_turn }}"
                data-queued-action="{% if settlement.queued_action %}true{% else %}false{% endif %}"
                data-owner-id="{{ settlement.nation.player.id }}"
            ></g>
        {% endfor %}
    </svg>
    <div id="action-menu" class="action-menu" style="display: none;">
        <div id="unit-info"></div>
        <div id="action-buttons"></div>
    </div>

    <div id="naming-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-title">Name Your Settlement</h3>
            <input type="text" id="settlement-name-input" maxlength="120">
            <div class="modal-actions">
                <button id="modal-confirm-btn">Confirm</button>
                <button id="modal-cancel-btn">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'hexquest/js/game_map.js' %}"></script>
</body>
</html>
