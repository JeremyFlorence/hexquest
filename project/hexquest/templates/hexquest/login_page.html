{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In - HexQuest</title>
    <link rel="stylesheet" href="{% static 'hexquest/css/base.css' %}">
</head>
<body>
<main>
    <section class="card">
        <h1>Log In</h1>

        {% if form.errors %}
            <p class="error">Your username and password did not match. Please try again.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Log in</button>
            <a href="{% url 'hexquest:register' %}">Create an account</a>
        </form>
    </section>
</main>
</body>
</html>
