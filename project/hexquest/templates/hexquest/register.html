{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - HexQuest</title>
    <link rel="stylesheet" href="{% static 'hexquest/css/base.css' %}">
</head>
<body>
<main>
    <section class="card">
        <h1>Create an Account</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Register</button>
            <a href="{% url 'hexquest:login' %}">Already have an account?</a>
        </form>
    </section>
</main>
</body>
</html>
