alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
name: hexquest
region: nyc
services:
- http_port: 8000
  instance_count: 1
  instance_size_slug: basic-xxs
  name: hexquest-web
  run_command: cd project && gunicorn project.wsgi
  source_dir: /
  envs:
  - key: DEBUG
    scope: RUN_TIME
    value: "False"
  - key: ALLOWED_HOSTS
    scope: RUN_TIME
    value: "*"
  - key: DATABASE_URL
    scope: RUN_TIME
    value: "postgres://user:password@host:port/dbname"
jobs:
- name: migrate
  kind: PRE_DEPLOY
  run_command: cd project && python manage.py migrate
  source_dir: /
  envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: "postgres://user:password@host:port/dbname"
databases:
- engine: PG
  name: db
  version: "15"
