alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
name: hexquest
region: nyc
services:
- http_port: 8000
  instance_count: 1
  instance_size_slug: basic-xxs
  name: hexquest-web
  run_command: cd project && daphne -b 0.0.0.0 -p $PORT project.asgi:application
  source_dir: /
  envs:
  - key: DEBUG
    scope: RUN_TIME
    value: "False"
  - key: SECRET_KEY
    scope: RUN_TIME
    type: SECRET
    value: "CHANGE_ME"
  - key: ALLOWED_HOSTS
    scope: RUN_TIME
    value: "${APP_DOMAIN}"
  - key: CSRF_TRUSTED_ORIGINS
    scope: RUN_TIME
    value: "${APP_URL}"
  - key: DATABASE_URL
    scope: RUN_TIME
    value: "${db.DATABASE_URL}"
jobs:
- name: migrate
  kind: PRE_DEPLOY
  run_command: cd project && python manage.py migrate
  source_dir: /
  envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: "${db.DATABASE_URL}"
databases:
- engine: PG
  name: db
  version: "15"
